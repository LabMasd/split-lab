<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>split.lab</title>
<meta name="description" content="Compare any number of videos behind draggable mask lines and export the composite as MP4 — entirely in your browser.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #101012;
    --panel: #17171a;
    --line: #2a2a2e;
    --text: #e8e8e8;
    --dim: #7a7a80;
    --accent: #F4501E;
  }
  body {
    background: var(--bg); color: var(--text);
    font: 12px/1.5 "SF Mono", ui-monospace, Menlo, monospace;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    user-select: none;
  }

  header {
    display: flex; align-items: center; gap: 16px;
    padding: 0 16px; height: 44px; border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  header .logo { font-weight: 700; letter-spacing: .05em; }
  header .logo span { color: var(--accent); }
  header .spacer { flex: 1; }
  header a { color: var(--dim); text-decoration: none; font-size: 10px; letter-spacing: .1em; }
  header a:hover { color: var(--text); }

  .label { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }

  select, button, input[type="text"], input[type="number"] {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    font: inherit; font-size: 11px; padding: 4px 8px; border-radius: 4px; outline: none;
  }
  select:hover, button:hover { border-color: #3f3f45; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { filter: brightness(1.1); }
  button:disabled { opacity: .4; cursor: default; }

  .toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--dim); }
  .toggle input { accent-color: var(--accent); }

  main { flex: 1; display: flex; min-height: 0; }

  #stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 20px; min-width: 0; position: relative;
  }
  #canvasWrap { position: relative; max-width: 100%; max-height: 100%; }
  canvas { display: block; max-width: 100%; max-height: calc(100vh - 160px); border-radius: 6px; }

  #dropHint {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px;
    align-items: center; justify-content: center; color: var(--dim);
    border: 1px dashed var(--line); border-radius: 8px; margin: 20px;
    pointer-events: none; text-align: center;
  }
  #dropHint b { color: var(--text); font-size: 14px; letter-spacing: .05em; }
  #dropHint .sub { font-size: 10px; }
  body.dragover #dropHint { border-color: var(--accent); color: var(--accent); }

  aside {
    width: 240px; flex-shrink: 0; border-left: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 14px; gap: 14px; overflow-y: auto;
  }
  .section { display: flex; flex-direction: column; gap: 8px; }

  #videoList { display: flex; flex-direction: column; gap: 6px; }
  .vid-item {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 6px 8px;
  }
  .vid-item .badge {
    width: 18px; height: 18px; border-radius: 3px; background: var(--accent);
    color: #fff; font-size: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .vid-item input {
    flex: 1; min-width: 0; background: none; border: none; padding: 2px 0;
    font-size: 11px; color: var(--text);
  }
  .vid-item .rm { background: none; border: none; color: var(--dim); font-size: 14px; padding: 0 2px; }
  .vid-item .rm:hover { color: var(--accent); }
  .vid-item .aud { background: none; border: none; font-size: 12px; padding: 0 2px; opacity: .3; }
  .vid-item .aud.on { opacity: 1; }

  .row { display: flex; align-items: center; gap: 8px; }
  .row > select { flex: 1; }

  .hint { font-size: 10px; color: var(--dim); line-height: 1.5; }

  #progressWrap { display: none; flex-direction: column; gap: 6px; }
  #progressBar { height: 4px; background: var(--panel); border-radius: 2px; overflow: hidden; }
  #progressFill { height: 100%; width: 0%; background: var(--accent); transition: width .1s; }
  #progressText { font-size: 10px; color: var(--dim); }

  footer {
    display: flex; align-items: center; gap: 14px;
    padding: 0 16px; height: 52px; border-top: 1px solid var(--line); flex-shrink: 0;
  }
  #playBtn { width: 34px; height: 34px; border-radius: 50%; font-size: 12px; }
  #timeText { color: var(--dim); font-size: 11px; min-width: 110px; }
  #scrub { flex: 1; accent-color: var(--accent); height: 4px; cursor: pointer; }
</style>
</head>
<body>

<header>
  <div class="logo">split<span>.</span>lab</div>
  <div class="spacer"></div>
  <label class="toggle"><input type="checkbox" id="showLabels"> labels</label>
  <label class="toggle"><input type="checkbox" id="exportLines" checked> lines in export</label>
  <a href="https://masd.cc" target="_blank" rel="noopener">MASD.CC</a>
</header>

<main>
  <div id="stage">
    <div id="canvasWrap">
      <canvas id="canvas" width="1920" height="1080"></canvas>
      <div id="dropHint">
        <b>DROP VIDEOS HERE</b>
        <div>2, 3, 4… no limit — drag the mask lines to compare</div>
        <div class="sub">everything runs in your browser — nothing is uploaded</div>
      </div>
    </div>
  </div>

  <aside>
    <div class="section">
      <div class="label">Videos</div>
      <div id="videoList"></div>
      <button id="addBtn">+ add video</button>
      <input type="file" id="fileInput" accept="video/*" multiple hidden>
    </div>

    <div class="section">
      <div class="label">Split</div>
      <button id="centerBtn">&#8982; center splits</button>
      <label class="toggle"><input type="checkbox" id="animate"> animate split</label>
      <div id="animOpts" style="display:none; flex-direction:column; gap:6px;">
        <select id="animDir">
          <option value="ltr">left &#8594; right</option>
          <option value="rtl">right &#8594; left</option>
        </select>
        <div class="row">
          <select id="animTiming" style="flex:1">
            <option value="clip">clip duration</option>
            <option value="custom">custom</option>
          </select>
          <input type="number" id="animSecs" value="2" min="0.1" step="0.1" style="width:56px; display:none;">
          <span class="label" id="animSecsLabel" style="display:none">sec</span>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="label">Export</div>
      <div class="row">
        <select id="fps">
          <option>24</option><option selected>25</option><option>30</option>
          <option>50</option><option>60</option>
        </select>
        <span class="label">fps</span>
        <select id="res">
          <option value="source" selected>source res</option>
          <option value="1920">1920 wide</option>
          <option value="1280">1280 wide</option>
        </select>
      </div>
      <button class="primary" id="exportBtn" disabled>EXPORT MP4</button>
      <div id="progressWrap">
        <div id="progressBar"><div id="progressFill"></div></div>
        <div id="progressText"></div>
      </div>
      <div class="hint">H.264 + sound, encoded right here in the browser.
      Need ProRes masters? Run the <a href="https://github.com/LabMasd/split-lab" target="_blank" rel="noopener" style="color:var(--dim)">local version</a>.</div>
    </div>
  </aside>
</main>

<footer>
  <button id="playBtn" disabled>&#9654;</button>
  <span id="timeText">00:00.0 / 00:00.0</span>
  <input type="range" id="scrub" min="0" max="1000" value="0" disabled>
</footer>

<script src="mp4-muxer.js"></script>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);

const state = {
  videos: [],      // { file, el, name }
  dividers: [],    // fractions 0..1, length = videos.length - 1
  playing: false,
  duration: 0,
  dragging: -1,
  exporting: false,
};

// ---------- video management ----------

function addFiles(files) {
  for (const file of files) {
    if (!file.type.startsWith('video/')) continue;
    const el = document.createElement('video');
    el.muted = state.videos.length > 0; // first video's audio on, rest off — no double track
    el.playsInline = true;
    el.preload = 'auto';
    el.src = URL.createObjectURL(file);
    el.addEventListener('loadedmetadata', onMetadata);
    state.videos.push({ file, el, name: file.name.replace(/\.[^.]+$/, '') });
  }
  resetDividers();
  renderList();
}

function onMetadata() {
  const first = state.videos[0];
  if (first && first.el.videoWidth) {
    canvas.width = Math.min(first.el.videoWidth, 3840);
    canvas.height = Math.round(canvas.width * first.el.videoHeight / first.el.videoWidth);
  }
  state.duration = Math.min(...state.videos.filter(v => v.el.duration).map(v => v.el.duration));
  updateEnabled();
}

function removeVideo(i) {
  URL.revokeObjectURL(state.videos[i].el.src);
  state.videos.splice(i, 1);
  if (state.videos.length) onMetadata(); else { state.duration = 0; setPlaying(false); }
  resetDividers();
  renderList();
  updateEnabled();
}

function resetDividers() {
  const n = state.videos.length;
  state.dividers = Array.from({ length: Math.max(0, n - 1) }, (_, i) => (i + 1) / n);
}

function renderList() {
  const list = $('videoList');
  list.innerHTML = '';
  state.videos.forEach((v, i) => {
    const item = document.createElement('div');
    item.className = 'vid-item';
    const badge = document.createElement('div');
    badge.className = 'badge';
    badge.textContent = String.fromCharCode(65 + (i % 26));
    const name = document.createElement('input');
    name.type = 'text';
    name.value = v.name;
    name.addEventListener('input', () => { v.name = name.value; });
    const aud = document.createElement('button');
    aud.className = 'aud' + (v.el.muted ? '' : ' on');
    aud.textContent = v.el.muted ? '🔇' : '🔊';
    aud.title = 'audio on / off';
    aud.addEventListener('click', () => { v.el.muted = !v.el.muted; renderList(); });
    const rm = document.createElement('button');
    rm.className = 'rm';
    rm.textContent = '×';
    rm.addEventListener('click', () => removeVideo(i));
    item.append(badge, name, aud, rm);
    list.append(item);
  });
  $('dropHint').style.display = state.videos.length ? 'none' : 'flex';
}

function updateEnabled() {
  const ready = state.videos.length >= 1 && state.duration > 0;
  $('playBtn').disabled = !ready || state.exporting;
  $('scrub').disabled = !ready || state.exporting;
  $('exportBtn').disabled = !(state.videos.length >= 2 && state.duration > 0) || state.exporting;
}

// ---------- drawing ----------

function drawCover(v, x, w) {
  const el = v.el;
  if (!el.videoWidth) return;
  const cw = canvas.width, ch = canvas.height;
  const s = Math.max(cw / el.videoWidth, ch / el.videoHeight);
  const dw = el.videoWidth * s, dh = el.videoHeight * s;
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, 0, w, ch);
  ctx.clip();
  ctx.drawImage(el, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
  ctx.restore();
}

function draw(showLines = true) {
  const cw = canvas.width, ch = canvas.height;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cw, ch);
  const xs = [0, ...state.dividers.map(d => d * cw), cw];
  state.videos.forEach((v, i) => drawCover(v, xs[i], xs[i + 1] - xs[i]));

  if ($('showLabels').checked) {
    ctx.font = `600 ${Math.round(ch * 0.028)}px ui-monospace, Menlo, monospace`;
    ctx.textBaseline = 'top';
    state.videos.forEach((v, i) => {
      const pad = Math.round(ch * 0.025);
      const label = v.name.toUpperCase();
      const tw = ctx.measureText(label).width;
      const lx = Math.min(xs[i] + pad, xs[i + 1] - tw - pad);
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.fillRect(lx - 8, pad - 6, tw + 16, ch * 0.028 + 12);
      ctx.fillStyle = '#fff';
      ctx.fillText(label, lx, pad);
    });
  }

  if (showLines) {
    const lw = Math.max(2, cw / 960);
    state.dividers.forEach(d => {
      const x = d * cw;
      ctx.fillStyle = '#fff';
      ctx.fillRect(x - lw / 2, 0, lw, ch);
    });
  }
}

// ---------- animated split ----------

function animActive() {
  return $('animate').checked && state.videos.length > 1;
}

function animDividers(t) {
  const n = state.videos.length;
  const dur = $('animTiming').value === 'custom'
    ? Math.max(0.1, parseFloat($('animSecs').value) || state.duration)
    : state.duration;
  const p = Math.min(1, Math.max(0, t / dur));
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const ltr = $('animDir').value === 'ltr';
  // wipes run sequentially: with N videos each divider sweeps its share of the timing
  return Array.from({ length: n - 1 }, (_, i) =>
    ltr ? clamp01(p * (n - 1) - (n - 2 - i))
        : 1 - clamp01(p * (n - 1) - i));
}

$('centerBtn').addEventListener('click', resetDividers);
$('animate').addEventListener('change', () => {
  $('animOpts').style.display = $('animate').checked ? 'flex' : 'none';
  if (!$('animate').checked) resetDividers();
});
$('animTiming').addEventListener('change', () => {
  const custom = $('animTiming').value === 'custom';
  $('animSecs').style.display = custom ? '' : 'none';
  $('animSecsLabel').style.display = custom ? '' : 'none';
});

// ---------- divider dragging ----------

function canvasX(e) {
  const r = canvas.getBoundingClientRect();
  return (e.clientX - r.left) / r.width;
}

canvas.addEventListener('pointerdown', e => {
  if (animActive()) return; // line is driven by the animation
  const fx = canvasX(e);
  const tol = 14 / canvas.getBoundingClientRect().width;
  let best = -1, bestD = tol;
  state.dividers.forEach((d, i) => {
    const dist = Math.abs(d - fx);
    if (dist < bestD) { bestD = dist; best = i; }
  });
  if (best >= 0) { state.dragging = best; canvas.setPointerCapture(e.pointerId); }
});

canvas.addEventListener('pointermove', e => {
  const fx = canvasX(e);
  if (state.dragging >= 0) {
    const i = state.dragging;
    const lo = (i > 0 ? state.dividers[i - 1] : 0) + 0.02;
    const hi = (i < state.dividers.length - 1 ? state.dividers[i + 1] : 1) - 0.02;
    state.dividers[i] = Math.min(hi, Math.max(lo, fx));
  } else {
    const tol = 14 / canvas.getBoundingClientRect().width;
    const near = !animActive() && state.dividers.some(d => Math.abs(d - fx) < tol);
    canvas.style.cursor = near ? 'ew-resize' : 'default';
  }
});

canvas.addEventListener('pointerup', () => { state.dragging = -1; });

// ---------- playback ----------

function setPlaying(p) {
  state.playing = p;
  $('playBtn').innerHTML = p ? '&#10074;&#10074;' : '&#9654;';
  state.videos.forEach(v => p ? v.el.play() : v.el.pause());
}

$('playBtn').addEventListener('click', () => setPlaying(!state.playing));
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !state.exporting && state.videos.length && e.target.tagName !== 'INPUT') {
    e.preventDefault();
    setPlaying(!state.playing);
  }
});

function seekAll(t) {
  state.videos.forEach(v => { v.el.currentTime = Math.min(t, (v.el.duration || t) - 0.001); });
}

$('scrub').addEventListener('input', () => {
  if (!state.duration) return;
  seekAll(($('scrub').value / 1000) * state.duration);
});

function fmt(t) {
  const m = Math.floor(t / 60), s = t % 60;
  return `${String(m).padStart(2, '0')}:${s.toFixed(1).padStart(4, '0')}`;
}

function tick() {
  requestAnimationFrame(tick);
  if (state.exporting) return;
  const master = state.videos[0];
  if (master && state.duration) {
    const t = master.el.currentTime;
    if (animActive()) state.dividers = animDividers(t);
    // loop at shortest duration
    if (state.playing && t >= state.duration - 0.03) {
      seekAll(0);
    } else if (state.playing) {
      // drift correction
      state.videos.slice(1).forEach(v => {
        if (Math.abs(v.el.currentTime - t) > 0.08) v.el.currentTime = t;
      });
    }
    if (state.dragging < 0) $('scrub').value = Math.round((t / state.duration) * 1000);
    $('timeText').textContent = `${fmt(t)} / ${fmt(state.duration)}`;
  }
  draw(true);
}
requestAnimationFrame(tick);

// ---------- file input / drag-drop ----------

$('addBtn').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });

['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); document.body.classList.add('dragover');
}));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); document.body.classList.remove('dragover');
}));
document.addEventListener('drop', e => addFiles(e.dataTransfer.files));

// ---------- export (fully in-browser: WebCodecs → mp4-muxer) ----------

function seekFrame(el, t) {
  return new Promise((resolve, reject) => {
    const dur = isFinite(el.duration) ? el.duration : t + 1;
    const target = Math.max(0, Math.min(t, dur - 0.001));
    const atTarget = () => Math.abs(el.currentTime - target) < 1 / 1000 && el.readyState >= 2;
    if (atTarget()) return resolve();
    let settled = false;
    const done = () => {
      if (settled) return;
      settled = true;
      el.removeEventListener('seeked', done);
      clearInterval(poll);
      clearTimeout(watchdog);
      resolve();
    };
    el.addEventListener('seeked', done);
    // same-time seeks may never fire 'seeked' (e.g. frame 0 before data is buffered) — poll as backup
    const poll = setInterval(() => { if (atTarget()) done(); }, 100);
    const watchdog = setTimeout(() => {
      if (settled) return;
      settled = true;
      el.removeEventListener('seeked', done);
      clearInterval(poll);
      reject(new Error('video seek timed out — try pressing play once, then export again'));
    }, 10000);
    el.currentTime = target;
  });
}

async function mixAudio() {
  // decode every enabled clip's audio and mix into one 48k stereo buffer
  const audioVids = state.videos.filter(v => !v.el.muted);
  if (!audioVids.length || !('AudioEncoder' in window)) return null;
  try {
    const sup = await AudioEncoder.isConfigSupported({
      codec: 'mp4a.40.2', sampleRate: 48000, numberOfChannels: 2, bitrate: 256000,
    });
    if (!sup.supported) return null;
  } catch { return null; }

  const oac = new OfflineAudioContext(2, Math.ceil(state.duration * 48000), 48000);
  let any = false;
  for (const v of audioVids) {
    try {
      const decoded = await oac.decodeAudioData(await v.file.arrayBuffer());
      const src = oac.createBufferSource();
      src.buffer = decoded;
      src.connect(oac.destination);
      src.start(0);
      any = true;
    } catch { /* clip has no decodable audio — skip it */ }
  }
  return any ? oac.startRendering() : null;
}

$('exportBtn').addEventListener('click', async () => {
  if (state.exporting) return;
  const wrap = $('progressWrap'), fill = $('progressFill'), text = $('progressText');
  wrap.style.display = 'flex';
  if (!('VideoEncoder' in window)) {
    text.textContent = 'this browser has no WebCodecs — use Chrome, Edge or Safari';
    return;
  }

  const fps = parseFloat($('fps').value);
  const includeLines = $('exportLines').checked;
  const totalFrames = Math.floor(state.duration * fps);

  // optional downscale
  const srcW = canvas.width, srcH = canvas.height;
  const resSel = $('res').value;
  if (resSel !== 'source' && srcW > parseInt(resSel, 10)) {
    canvas.width = parseInt(resSel, 10);
    canvas.height = Math.round(canvas.width * srcH / srcW);
  }
  // H.264 needs even dimensions
  canvas.width -= canvas.width % 2;
  canvas.height -= canvas.height % 2;
  const W = canvas.width, H = canvas.height;

  state.exporting = true;
  setPlaying(false);
  updateEnabled();
  let encoderError = null;

  try {
    if (!isFinite(state.duration) || totalFrames < 1) {
      throw new Error('could not read a valid duration from the videos');
    }
    text.textContent = 'preparing audio…';
    const audioBuf = await mixAudio();

    const target = new Mp4Muxer.ArrayBufferTarget();
    const muxer = new Mp4Muxer.Muxer({
      target,
      video: { codec: 'avc', width: W, height: H },
      ...(audioBuf ? { audio: { codec: 'aac', sampleRate: 48000, numberOfChannels: 2 } } : {}),
      fastStart: 'in-memory',
    });

    const venc = new VideoEncoder({
      output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
      error: e => { encoderError = e; },
    });
    const level = (W * H > 2073600 || fps > 30) ? '640034' : '640028';
    venc.configure({
      codec: `avc1.${level}`, width: W, height: H,
      bitrate: Math.min(90_000_000, Math.round(W * H * fps * 0.3)),
      framerate: fps,
    });

    const gop = Math.max(1, Math.round(fps * 2));
    for (let f = 0; f < totalFrames; f++) {
      if (encoderError) throw encoderError;
      const t = f / fps;
      if (animActive()) state.dividers = animDividers(t);
      await Promise.all(state.videos.map(v => seekFrame(v.el, t)));
      draw(includeLines);
      const frame = new VideoFrame(canvas, {
        timestamp: Math.round(f * 1e6 / fps),
        duration: Math.round(1e6 / fps),
      });
      venc.encode(frame, { keyFrame: f % gop === 0 });
      frame.close();
      if (venc.encodeQueueSize > 8) {
        await new Promise(r => venc.addEventListener('dequeue', r, { once: true }));
      }
      fill.style.width = `${(f / totalFrames) * 92}%`;
      text.textContent = `rendering frame ${f + 1} / ${totalFrames}`;
    }
    await venc.flush();
    if (encoderError) throw encoderError;

    if (audioBuf) {
      text.textContent = 'encoding audio…';
      const aenc = new AudioEncoder({
        output: (chunk, meta) => muxer.addAudioChunk(chunk, meta),
        error: e => { encoderError = e; },
      });
      aenc.configure({ codec: 'mp4a.40.2', sampleRate: 48000, numberOfChannels: 2, bitrate: 256000 });
      const ch0 = audioBuf.getChannelData(0);
      const ch1 = audioBuf.numberOfChannels > 1 ? audioBuf.getChannelData(1) : ch0;
      const CHUNK = 1024, L = audioBuf.length;
      for (let off = 0; off < L; off += CHUNK) {
        const n = Math.min(CHUNK, L - off);
        const data = new Float32Array(n * 2);
        data.set(ch0.subarray(off, off + n), 0);
        data.set(ch1.subarray(off, off + n), n);
        const ad = new AudioData({
          format: 'f32-planar', sampleRate: 48000,
          numberOfFrames: n, numberOfChannels: 2,
          timestamp: Math.round(off / 48000 * 1e6), data,
        });
        aenc.encode(ad);
        ad.close();
      }
      await aenc.flush();
      if (encoderError) throw encoderError;
    }

    muxer.finalize();
    const blob = new Blob([target.buffer], { type: 'video/mp4' });
    const stamp = new Date().toISOString().replace(/[:T]/g, '-').slice(0, 16);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `split-lab_${stamp}.mp4`;
    a.click();
    URL.revokeObjectURL(a.href);
    fill.style.width = '100%';
    text.textContent = `done — split-lab_${stamp}.mp4${audioBuf ? '' : ' (no audio track)'}`;
  } catch (err) {
    text.textContent = 'export failed: ' + (err.message || err);
  } finally {
    canvas.width = srcW;
    canvas.height = srcH;
    state.exporting = false;
    updateEnabled();
    setTimeout(() => { wrap.style.display = 'none'; fill.style.width = '0%'; }, 5000);
  }
});

renderList();
</script>
</body>
</html>
